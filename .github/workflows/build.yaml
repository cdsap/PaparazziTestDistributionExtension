name: build

on: [push, pull_request]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  lib-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Library Tests
        run: ./gradlew :lib:test

      - name: Run Paparazzi Compatibility Tests
        run: ./gradlew :lib:testPaparazziCompatAll

      - name: Run Gradle Plugin Unit Tests
        run: ./gradlew :gradle-plugin:test

      - name: Run Gradle Plugin Functional Tests
        run: ./gradlew :gradle-plugin:functionalTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-lib
          path: |
            lib/build/reports/tests/
            gradle-plugin/build/reports/tests/

  integration-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "AGP 8.13 + Paparazzi alpha02 (published 0.4.0)"
            project-dir: "integration-test/agp8"
            slug: "agp8-published"
            use-local-publish: false
          - name: "AGP 9.0 + Paparazzi alpha04 (local 0.5.0-SNAPSHOT)"
            project-dir: "integration-test/agp9"
            slug: "agp9-local"
            use-local-publish: true

    runs-on: ubuntu-latest
    name: "integration (${{ matrix.name }})"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish plugin and library to Maven Local
        if: matrix.use-local-publish
        run: ./gradlew :lib:publishToMavenLocal :gradle-plugin:publishToMavenLocal

      - name: Run integration test
        working-directory: ${{ matrix.project-dir }}
        run: ./gradlew :app:recordPaparazziDebug --stacktrace
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GE_TMP_KEY }}

      - name: Upload app project output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-output-${{ matrix.slug }}
          path: |
            ${{ matrix.project-dir }}/app/build/
            ${{ matrix.project-dir }}/app/src/test/snapshots/
